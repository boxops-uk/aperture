# What a branch must prove, and what a release must carry.
#
# Four jobs, because they answer different questions and are trusted differently:
#
#   test    always runs, including on a pull request from a fork. `PLAN.md`'s
#           definition of done everywhere is "a task ends in a green test", and
#           this is the only thing that enforces it: fmt, clippy over every
#           target, the suite, and the invariant coverage ledger printed so a
#           reviewer can read what is still pending without running anything.
#
#           A **debug** build on purpose. Several correctness guards are
#           `cfg(debug_assertions)` — the merge frontier's never-nested
#           assertion and `put_fact`'s write-once contract among them — so a
#           release-profile test run would silently not check them.
#
#   package always runs. It answers what a *consumer* gets rather than what the tree
#           does: what each published crate would upload, that crates.io would accept
#           the bottom of the SDK, that the documentation docs.rs builds has no broken
#           link in it, and that the .NET package builds on both the frameworks it
#           claims and packs with its licence and its front page inside.
#
#   build   always runs, including on a pull request from a fork. It is a
#           required status check on `main` and `release/*`, so nothing lands
#           anywhere without compiling under the tree's own Cargo.lock. Separate
#           from `test` because it answers a different question — that the
#           *shipped profile* compiles — and because a release build and a debug
#           test run share no cache.
#
#   attest  builds and signs SLSA provenance naming the binaries. It needs an
#           OIDC token, which GitHub never issues to a fork's pull request, so
#           it is skipped there — a required check that cannot run would block a
#           branch forever rather than protect it. It runs on every push to
#           `main` and `release/*`, on every `v*` tag, and on demand.
#
# Verify anything it produced:
#
#     gh attestation verify ./fjord --repo boxops-uk/fjord
name: release

on:
  push:
    branches: ['main', 'release/**']
    tags: ['v*']
  pull_request:
    branches: ['main', 'release/**']
  workflow_dispatch:

# Least privilege at the top; only `attest` widens it.
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
      # Cheapest first, so a formatting slip does not cost a compile.
      - name: Formatting
        run: cargo fmt --all --check
      # `--all-targets` is the point: without it, tests, examples and benches are
      # never even compiled, and the six measuring instruments under `examples/`
      # would rot green.
      - name: Clippy
        run: cargo clippy --all-targets --workspace --locked -- -D warnings
      # `default-members` is the whole workspace, so this means everything.
      - name: Tests
        run: cargo test --locked
      # The coverage ledger (`docs/testing.md`): guards written up front and not
      # yet live. Printed rather than asserted — a number here would have to be
      # edited by whoever un-ignores one, and the list is what a reviewer reads.
      - name: Invariant coverage ledger
        run: cargo test --locked -- --ignored --list

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-package-${{ hashFiles('Cargo.lock') }}
      # **What each published crate would actually upload.** `cargo package` obeys
      # `include`, so this is the check that a package holds the library, its licence
      # and its front page — and not a test that reads a golden from the repository it
      # is no longer in.
      #
      # `--list` rather than `--dry-run` for the three that have dependencies: a
      # dry-run resolves them against crates.io, and they are not there until the one
      # below them is published. `--list` needs no registry, and the build is already
      # proven by `test` and `build`.
      - name: What the packages would contain
        run: |
          for crate in fjord-schema fjord-wire fjord-client fjord-db; do
            echo "── $crate"
            cargo package --locked --list -p "$crate"
          done
      # The bottom of the SDK has no Fjord dependencies, so it is the one that *can* be
      # fully verified — manifest, metadata and a build of the packaged copy — before
      # anything is uploaded. crates.io refuses a package with no description or licence,
      # and this is where that is found out.
      - name: Verify the package crates.io would accept
        run: cargo publish --locked --dry-run -p fjord-schema
      # **Documentation is part of the package.** docs.rs has no repository to walk up
      # into, so a relative link in a published crate is a broken link on the page a
      # consumer actually reads; `-D warnings` also catches an unresolved intra-doc link
      # and a public item documented against a private one.
      - name: Documentation, as docs.rs would build it
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps -p fjord-schema -p fjord-wire -p fjord-client -p fjord-db
      # The .NET half of the same question. `Fjord.Client` is the only packable project
      # here — the demo producer and the real indexer are console programs — and it
      # multi-targets, so this is also what says the library still builds on the LTS.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: clients/dotnet/global.json
      - name: What the NuGet package would contain
        run: |
          dotnet build clients/dotnet/Fjord.slnx -warnaserror
          dotnet pack clients/dotnet/Fjord.Client -c Release -o /tmp/nupkg
          ls -l /tmp/nupkg

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
      # --locked so this is the Cargo.lock in the tree and not whatever resolves
      # today; the fjall pin in particular is load-bearing.
      - name: Build release binaries
        run: cargo build --release --locked -p fjord-cli -p fjord-viewer --bins

  attest:
    name: attest
    runs-on: ubuntu-latest
    # Skipped only for a fork's pull request, which cannot be given an OIDC token.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write # OIDC token the provenance is bound to
      attestations: write # write the attestation back to the repository
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
      - name: Build release binaries
        run: cargo build --release --locked -p fjord-cli -p fjord-viewer --bins
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            target/release/fjord
            target/release/fjord-viewer
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: fjord-linux-x86_64
          path: |
            target/release/fjord
            target/release/fjord-viewer
          if-no-files-found: error
