# What a branch must prove, and what a release must carry.
#
# Two jobs, because they answer different questions and are trusted differently:
#
#   build   always runs, including on a pull request from a fork. It is the
#           required status check on `main` and `release/*`, so nothing lands
#           anywhere without compiling under the tree's own Cargo.lock.
#
#   attest  builds and signs SLSA provenance naming the binaries. It needs an
#           OIDC token, which GitHub never issues to a fork's pull request, so
#           it is skipped there — a required check that cannot run would block a
#           branch forever rather than protect it. It runs on every push to
#           `main` and `release/*`, on every `v*` tag, and on demand.
#
# Verify anything it produced:
#
#     gh attestation verify ./aperture --repo boxops-uk/aperture
name: release

on:
  push:
    branches: ['main', 'release/**']
    tags: ['v*']
  pull_request:
    branches: ['main', 'release/**']
  workflow_dispatch:

# Least privilege at the top; only `attest` widens it.
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
      # --locked so this is the Cargo.lock in the tree and not whatever resolves
      # today; the fjall pin in particular is load-bearing.
      - name: Build release binaries
        run: cargo build --release --locked -p aperture-cli -p aperture-viewer --bins

  attest:
    name: attest
    runs-on: ubuntu-latest
    # Skipped only for a fork's pull request, which cannot be given an OIDC token.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write # OIDC token the provenance is bound to
      attestations: write # write the attestation back to the repository
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
      - name: Build release binaries
        run: cargo build --release --locked -p aperture-cli -p aperture-viewer --bins
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            target/release/aperture
            target/release/aperture-viewer
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: aperture-linux-x86_64
          path: |
            target/release/aperture
            target/release/aperture-viewer
          if-no-files-found: error
