# What a branch must prove, and what a release must carry.
#
# Seven jobs, because they answer different questions and are trusted differently:
#
#   test    always runs, including on a pull request from a fork. `PLAN.md`'s
#           definition of done everywhere is "a task ends in a green test", and
#           this is the only thing that enforces it: fmt, clippy over every
#           target, the suite, and the invariant coverage ledger printed so a
#           reviewer can read what is still pending without running anything.
#
#           fmt and clippy run on a **pinned** toolchain and the suite on `stable`.
#           A required check that can go red because an upstream released is a
#           check that blocks merges for a reason nobody chose.
#
#           A **debug** build on purpose. Several correctness guards are
#           `cfg(debug_assertions)` — the merge frontier's never-nested
#           assertion and `put_fact`'s write-once contract among them — so a
#           release-profile test run would silently not check them.
#
#   package always runs. It answers what a *consumer* gets rather than what the tree
#           does: what each published crate would upload, that crates.io would accept
#           the bottom of the SDK, that the documentation docs.rs builds has no broken
#           link in it, and that the .NET package builds on both the frameworks it
#           claims and packs with its licence and its front page inside.
#
#   build   always runs, including on a pull request from a fork. It is a
#           required status check on `main` and `release/*`, so nothing lands
#           anywhere without compiling under the tree's own Cargo.lock. Separate
#           from `test` because it answers a different question — that the
#           *shipped profile* compiles — and because a release build and a debug
#           test run share no cache.
#
#   site    always runs. What a *docs* consumer gets: the interactive book — the
#           React bundle in `web/`, with the engine compiled to WebAssembly inside
#           it — driven in a real browser before it is bundled as a tarball any
#           static file server can serve, attested like the binaries. The bundle is
#           uploaded on every run and attached to releases.
#
#           The generated site (`website/build.py`) is still built here, because the
#           smoke check compares the two renderers page for page; what publishes is
#           the bundle.
#
#   pages   publishes main's site to GitHub Pages, and only main's: a pull request or
#           a release branch never moves the public docs. Runs after `test`, so a red
#           suite or a failed drift gate never publishes.
#
#   release runs for a `v*` tag only, after the checks below have passed, and creates the
#           GitHub Release with the attested binaries, the docs bundle and their
#           checksums. It deliberately does *not* push to crates.io or nuget.org: a
#           registry upload cannot be undone and a Release can, so that step stays a
#           person's.
#
#   attest  builds and signs SLSA provenance naming the binaries. It needs an
#           OIDC token, which GitHub never issues to a fork's pull request, so
#           it is skipped there — a required check that cannot run would block a
#           branch forever rather than protect it. It runs on every push to
#           `main` and `release/*`, on every `v*` tag, and on demand.
#
# Verify anything it produced:
#
#     gh attestation verify ./fjord --repo boxops-uk/fjord
name: release

on:
  push:
    branches: ['main', 'release/**']
    tags: ['v*']
  pull_request:
    branches: ['main', 'release/**']
  workflow_dispatch:

# Least privilege at the top; only `attest` widens it.
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # **The lint gate is pinned; the tests are not.** They answer different
      # questions and want different toolchains.
      #
      # `-D warnings` on a floating `stable` makes a clippy release able to redden a
      # branch nobody has touched — and since `test` is a required check, that blocks
      # every merge until somebody fixes lints that did not exist when the code landed.
      # It is the same argument the `fjall = "=3.1.8"` pin makes: a break should happen
      # when someone chooses to upgrade, with the diff in front of them, rather than on
      # a day the upstream released. rustfmt is pinned for the same reason — its output
      # changes between versions too.
      #
      # So this is the version a contributor is checked against, and `cargo fmt` and
      # `cargo clippy` passing locally on it mean passing here. Bumping it is a commit.
      - name: Pinned toolchain, for fmt and clippy
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      # Installed second, so it is the default: the suite runs on whatever stable is
      # today, because that is what a consumer has. `build` floats too, so a compiler
      # that breaks the tree is still caught the day it lands — just not as a lint.
      #
      # The wasm target rides along because of the check below: it costs one
      # component download and it is the only thing that can prove the browser
      # build still exists.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
      # Cheapest first, so a formatting slip does not cost a compile.
      - name: Formatting
        run: cargo +1.97.1 fmt --all --check
      # `--all-targets` is the point: without it, tests, examples and benches are
      # never even compiled, and the six measuring instruments under `examples/`
      # would rot green.
      - name: Clippy
        run: cargo +1.97.1 clippy --all-targets --workspace --locked -- -D warnings
      # `default-members` is the whole workspace, so this means everything.
      - name: Tests
        run: cargo test --locked
      # The coverage ledger (AGENTS.md, testing): guards written up front and not
      # yet live. Printed rather than asserted — a number here would have to be
      # edited by whoever un-ignores one, and the list is what a reviewer reads.
      - name: Invariant coverage ledger
        run: cargo test --locked -- --ignored --list
      # **The other configuration.** `fjord-inspect` turns the engine's `trace`
      # feature on, so the workspace run above builds the engine *traced* — which
      # is what puts the alloc-free and no-value-fetch guards on the build the
      # browser ships. This builds it without, since nothing in this graph asks
      # for the feature, and a feature nobody tests is an aspiration.
      - name: The engine without its trace hook
        run: cargo test --locked -p fjord-engine
      # **The claim `dependency_closure` cannot make on its own.** That guard reads
      # the workspace manifests and fails if the engine grows an edge to a backend;
      # only a compile can catch a *third-party* dependency that refuses the target
      # — which is how this breaks in practice, since `getrandom` compile-errors on
      # `wasm32-unknown-unknown` rather than failing to link. `wasm/` is its own
      # workspace, so the crate that matters is named explicitly here.
      - name: The engine still compiles for a browser
        run: cargo check -p fjord-engine -p fjord-inspect --target wasm32-unknown-unknown --locked
      # The website is the design book. `--strict` turns the generator's own
      # warnings — a page missing from the nav, a nav entry with no page — into a
      # failure, so the book cannot silently lose a page.
      - name: Website builds clean
        run: python3 website/build.py --strict
      # The drift gate: site links and anchors resolve, invariant citations in the
      # crates resolve to the registry, nothing references a retired doc, and no
      # build-plan phase number survives in code or the book. Each check is a way
      # the documentation actually went stale once.
      - name: Documentation is consistent
        run: python3 scripts/check-docs.py

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-package-${{ hashFiles('Cargo.lock') }}
      # **What each published crate would actually upload.** `cargo package` obeys
      # `include`, so this is the check that a package holds the library, its licence
      # and its front page — and not a test that reads a golden from the repository it
      # is no longer in.
      #
      # `--list` rather than `--dry-run` for the three that have dependencies: a
      # dry-run resolves them against crates.io, and they are not there until the one
      # below them is published. `--list` needs no registry, and the build is already
      # proven by `test` and `build`.
      - name: What the packages would contain
        run: |
          for crate in fjord-schema fjord-wire fjord-client fjord-db; do
            echo "── $crate"
            cargo package --locked --list -p "$crate"
          done
      # The bottom of the SDK has no Fjord dependencies, so it is the one that *can* be
      # fully verified — manifest, metadata and a build of the packaged copy — before
      # anything is uploaded. crates.io refuses a package with no description or licence,
      # and this is where that is found out.
      - name: Verify the package crates.io would accept
        run: cargo publish --locked --dry-run -p fjord-schema
      # **Documentation is part of the package.** docs.rs has no repository to walk up
      # into, so a relative link in a published crate is a broken link on the page a
      # consumer actually reads; `-D warnings` also catches an unresolved intra-doc link
      # and a public item documented against a private one.
      - name: Documentation, as docs.rs would build it
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps -p fjord-schema -p fjord-wire -p fjord-client -p fjord-db
      # The .NET half of the same question. `Boxops.Fjord.Client` is the only packable project
      # here — the demo producer and the real indexer are console programs — and it
      # multi-targets, so this is also what says the library still builds on the LTS.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: clients/dotnet/global.json
      - name: What the NuGet package would contain
        run: |
          dotnet build clients/dotnet/Boxops.Fjord.slnx -warnaserror
          dotnet pack clients/dotnet/Boxops.Fjord.Client -c Release -o /tmp/nupkg
          ls -l /tmp/nupkg

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
      # --locked so this is the Cargo.lock in the tree and not whatever resolves
      # today; the fjall pin in particular is load-bearing.
      - name: Build release binaries
        run: cargo build --release --locked -p fjord-cli -p fjord-viewer --bins

  # **The docs bundle.** The site is the design book, and the book is `web/` now: the
  # React bundle with `fjord-engine` compiled to WebAssembly inside it, so a page that
  # shows what the lexer does is asking the lexer. This is the shape a release of it
  # takes — `web/dist/` as a tarball, no toolchain at serve time. Attested like the
  # binaries, because "verify anything it produced" should not have an exception for
  # documentation.
  #
  # **A page here is a path**, not a file and not a fragment, and that costs the bundle
  # two things the tree of `.html` files did not. A host has to answer an unknown path
  # with the application — `dist/404.html` is that answer where a host uses one, which
  # is how Pages does it — and the base the assets and routes are written against is
  # compiled in, so this builds twice and the two copies are **not** interchangeable:
  # the tarball is for a site at a root, and Pages serves this one under the
  # repository's name.
  site:
    name: site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token the provenance is bound to
      attestations: write # write the attestation back to the repository
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # `wasm/` is its own workspace, with its own lock and its own target directory,
      # so it shares no cache with the jobs above — the key is deliberately different.
      - name: Cache cargo registry and the wasm target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('wasm/Cargo.lock') }}
      # **The CLI's version has to equal the crate's exactly.** The CLI reads a schema
      # the crate encodes into the module, and a mismatch fails with a message about a
      # section rather than about versions — `build-wasm.sh` refuses to run at all
      # unless they agree. So the version comes from the same place the script reads
      # it, and the release binary is downloaded rather than compiled: `cargo install
      # wasm-bindgen-cli` is minutes of build time for a tool that ships a binary.
      - name: wasm-bindgen, at the version the crate encodes
        run: |
          version=$(cd wasm && cargo tree --locked -p wasm-bindgen --depth 0 |
            sed -nE '1s/^wasm-bindgen v([0-9.]+).*/\1/p')
          target=x86_64-unknown-linux-musl
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version/wasm-bindgen-$version-$target.tar.gz" |
            tar -xz --strip-components=1 -C "$HOME/.local/bin" "wasm-bindgen-$version-$target/wasm-bindgen"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          "$HOME/.local/bin/wasm-bindgen" --version
      - name: Dependencies
        run: npm ci
        working-directory: web
      # Before the site, and after `npm ci`: the script shrinks the module with the
      # `wasm-opt` that `web/`'s dev-dependencies bring, and a module that skipped that
      # step is the one thing a reader downloads before seeing anything.
      - name: The engine, compiled for a browser
        run: ./scripts/build-wasm.sh
      - name: Lint
        run: npm run lint
        working-directory: web
      # **The other renderer**, built here because the smoke check reads it: it compares
      # the two page for page — headings, tables, code blocks, callouts and demos — and
      # the two parsers are in different languages, so nothing but that check keeps the
      # dialects together. `--strict` again for the same reason `test` uses it.
      - name: The generated site, for the two-renderer comparison
        run: python3 website/build.py --strict
      # **The bundle, driven in a real browser before it ships.** A unit test here would
      # mock the one thing worth checking — that a module built from the engine loads
      # under a browser's own loader and answers what the host suite says it answers —
      # so `npm run smoke` builds, serves and drives the real bundle, and fails on any
      # console error.
      #
      # The runner image ships a Chrome, and the check takes it from `$CHROME`. Found
      # rather than written as a path, because `$CHROME` is not probed for existence:
      # a stale literal would surface as three failed browser launches instead of as a
      # missing browser. With none on the image, one is fetched into the cache the
      # check looks in next.
      - name: Drive the bundle in a browser
        working-directory: web
        run: |
          chrome=$(command -v google-chrome || command -v chromium || true)
          [[ -n "$chrome" ]] ||
            npx -y @puppeteer/browsers install chrome@stable --path "$HOME/.cache/puppeteer"
          CHROME="$chrome" npm run smoke
      # `npm run build` is `tsc -b && vite build`, so this is also the typecheck: the
      # smoke drives a bundle Vite built through its API, which does not typecheck.
      - name: Build the site
        run: npm run build
        working-directory: web
      - name: Bundle
        run: |
          tar -czf fjord-docs-site.tar.gz -C web/dist .
          sha256sum fjord-docs-site.tar.gz > fjord-docs-site.tar.gz.sha256
          cat fjord-docs-site.tar.gz.sha256
      # Step-level rather than job-level skip, unlike `attest`: a fork's pull request
      # still gets the bundle built and uploaded — only the provenance needs the OIDC
      # token a fork is never issued.
      - name: Attest the bundle
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: fjord-docs-site.tar.gz
      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: fjord-docs-site
          path: |
            fjord-docs-site.tar.gz
            fjord-docs-site.tar.gz.sha256
          if-no-files-found: error
      # **Not the same bytes as the tarball**, which is what changed when the site
      # stopped being a tree of relative links: `SITE_BASE` is compiled in, so the copy
      # Pages serves has to be built against the path Pages serves it from. Taken from
      # the repository's name rather than written as a literal, so a rename cannot leave
      # a published site fetching its assets from a path nothing answers on.
      - name: Build the site Pages serves
        run: SITE_BASE="/${GITHUB_REPOSITORY#*/}/" npm run build
        working-directory: web
      - name: Upload for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  # **Publishing the book.** Push-to-main only: the public site is main's and nothing
  # else's, and it moves only after `test` — the suite, the strict site build and the
  # drift gate — has said the book is true, and after `site` has driven the bundle it
  # deploys in a browser. `site` builds that copy against the base Pages serves it
  # from, so this job needs no build of its own.
  pages:
    name: pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, site]
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to Pages
      id-token: write # verify the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # `enablement: true` turns Pages on (source: GitHub Actions) if it never has
      # been. If the API refuses the workflow token that one-time step is a manual
      # flip in Settings → Pages, and a re-run of this job succeeds.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  attest:
    name: attest
    runs-on: ubuntu-latest
    # Skipped only for a fork's pull request, which cannot be given an OIDC token.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write # OIDC token the provenance is bound to
      attestations: write # write the attestation back to the repository
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
      - name: Build release binaries
        run: cargo build --release --locked -p fjord-cli -p fjord-viewer --bins
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            target/release/fjord
            target/release/fjord-viewer
      # Checksums beside the binaries, because an attestation says *this workflow built
      # this file* and a checksum says *this is that file* — a consumer who downloaded
      # from the Release page needs both, and only one of them is generated for them.
      - name: Checksums
        run: |
          cd target/release
          sha256sum fjord fjord-viewer > SHA256SUMS
          cat SHA256SUMS
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: fjord-linux-x86_64
          path: |
            target/release/fjord
            target/release/fjord-viewer
            target/release/SHA256SUMS
          if-no-files-found: error

  # **Cutting the release**, which happens only for a `v*` tag.
  #
  # It runs after `test`, `package` and `attest` — a tag that does not pass them produces
  # no release rather than a released failure. What it does *not* do is publish to
  # crates.io or nuget.org: AGENTS.md's repository-rules section records that publishing is not
  # gated, and the reason it stays manual is that a registry upload is irreversible while
  # a GitHub Release can be deleted. `package` has already proven both would be accepted.
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package, attest, site]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release and attach files to it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fjord-linux-x86_64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: fjord-docs-site
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Fjord DB $version" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md).

          Binaries below are Linux x86_64 and carry SLSA provenance:

          \`\`\`
          gh attestation verify ./fjord --repo ${GITHUB_REPOSITORY}
          \`\`\`

          \`fjord-docs-site.tar.gz\` is the design book as built at this tag — the
          interactive site, with the engine compiled into the page, attested the same
          way. A page in it is a path, so serve it from a root with unknown paths
          answered by \`index.html\`; the \`404.html\` beside it is that answer for a
          host that uses one." \
            dist/fjord dist/fjord-viewer dist/SHA256SUMS \
            dist/fjord-docs-site.tar.gz dist/fjord-docs-site.tar.gz.sha256
