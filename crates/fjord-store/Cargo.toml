[package]
name = "fjord-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Fjord DB's storage seam: what a fact is on disk, and the trait the engine reads it through — an internal crate"
# Not on crates.io. A package is the client library for a language and nothing
# else — what it takes to construct facts, talk to a database and read rows back.
# This is an internal of the implementation, and publishing it would make its
# shape somebody's dependency.
publish = false

[features]
# The shared fixture database and the store-shaped probes, for consumers
# outside this crate's own `cfg(test)` — both implementations, and the engine's
# batteries above all.
# A plain feature, with no dependency behind it: what it gates is the shared
# fixture database and the store-shaped probes, and neither draws a value. The
# strategies that do live above this crate.
proptest = []

[dependencies]
fjord-encoding = { path = "../fjord-encoding" }
fjord-schema = { path = "../fjord-schema" }
byteview = { workspace = true }
lasso = { workspace = true }
thiserror = { workspace = true }

