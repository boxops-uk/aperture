[package]
name = "fjord-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "sigla, Fjord DB's query language, and the suspendable executor that runs it — an internal crate"
# Not on crates.io. A package is the client library for a language and nothing
# else — what it takes to construct facts, talk to a database and read rows back.
# This is an internal of the implementation, and publishing it would make its
# shape somebody's dependency.
publish = false

[features]
# Exposes the `arb_*` strategies, the shared fixtures and the corpus to consumers
# outside `cfg(test)` — integration tests, and the store crate's I8 guard.
proptest = [
    "dep:proptest",
    "fjord-encoding/proptest",
    "fjord-store/proptest",
]

[dependencies]
fjord-encoding = { path = "../fjord-encoding" }
fjord-schema = { path = "../fjord-schema" }
fjord-store = { path = "../fjord-store" }
byteview = { workspace = true }
codespan-reporting = "0.13.1"
lasso = { workspace = true }
logos = "0.16.1"
proptest = { version = "1.11.0", optional = true }
serde = { workspace = true }
thiserror = { workspace = true }
tinyvec = { version = "1.11.0", features = ["alloc"] }
tokio-util = "0.7.18"

[build-dependencies]
lelwel = "0.10"

[dev-dependencies]
allocation-counter = "0.8.1"
fjord-encoding = { path = "../fjord-encoding", features = ["proptest"] }
fjord-store = { path = "../fjord-store", features = ["proptest"] }
proptest = "1.11.0"
tempfile = "3"
