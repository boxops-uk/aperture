[package]
name = "fjord-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Fjord DB's write funnel: interning a nested fact into the store — an internal crate"
# Not on crates.io. A package is the client library for a language and nothing
# else — what it takes to construct facts, talk to a database and read rows back.
# This is an internal of the implementation, and publishing it would make its
# shape somebody's dependency.
publish = false

[dependencies]
# The three things a fact has to cross to get in: the wire form it arrived as, the
# storage form it is written in, and the store that holds it. This crate is that
# crossing and nothing else — which is why it is its own crate rather than a module
# of any of them, since each would then have to know about the other two.
fjord-encoding = { path = "../fjord-encoding" }
fjord-schema = { path = "../fjord-schema" }
fjord-store = { path = "../fjord-store" }
fjord-wire = { path = "../fjord-wire" }
thiserror = { workspace = true }

[dev-dependencies]
fjord-wire = { path = "../fjord-wire", features = ["proptest"] }
lasso = { workspace = true }
proptest = "1.11.0"
tempfile = "3.24.0"
