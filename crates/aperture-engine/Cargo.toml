[package]
name = "aperture-engine"
version = "0.1.0"
edition = "2024"

[features]
# Exposes the `arb_*` strategies, the shared fixtures and the corpus to consumers
# outside `cfg(test)` — integration tests, and the store crate's I8 guard.
proptest = [
    "dep:proptest",
    "aperture-encoding/proptest",
    "aperture-store/proptest",
]

[dependencies]
aperture-encoding = { path = "../aperture-encoding" }
aperture-schema = { path = "../aperture-schema" }
aperture-store = { path = "../aperture-store" }
byteview = { workspace = true }
codespan-reporting = "0.13.1"
lasso = { workspace = true }
logos = "0.16.1"
proptest = { version = "1.11.0", optional = true }
serde = { workspace = true }
thiserror = { workspace = true }
tinyvec = { version = "1.11.0", features = ["alloc"] }
tokio-util = "0.7.18"

[build-dependencies]
lelwel = "0.10"

[dev-dependencies]
allocation-counter = "0.8.1"
aperture-encoding = { path = "../aperture-encoding", features = ["proptest"] }
aperture-store = { path = "../aperture-store", features = ["proptest"] }
proptest = "1.11.0"
tempfile = "3"
