[package]
name = "fjord-encoding"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Fjord DB's order-preserving storage tuple codec — an internal crate, frozen on disk"
# Not on crates.io. A package is the client library for a language and nothing
# else — what it takes to construct facts, talk to a database and read rows back.
# This is an internal of the implementation, and publishing it would make its
# shape somebody's dependency.
publish = false

[features]
# Mirrors the root package's feature: exposes the `arb_*` strategies to
# consumers outside this crate's own `cfg(test)`.
proptest = ["dep:proptest"]

[dependencies]
fjord-schema = { path = "../fjord-schema" }
lasso = { workspace = true }
memchr = { workspace = true }
proptest = { version = "1.11.0", optional = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = "1.11.0"
