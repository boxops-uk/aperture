[package]
name = "fjord-server"
version = "0.1.0"
edition = "2024"

[features]
# Task-level instrumentation for `tokio-console`, off by default. The flag belongs
# here because this is the crate that spawns the tasks worth looking at; the CLI's
# `console` feature turns it on along with the subscriber that serves them.
console = ["tokio/tracing"]

[dependencies]
# Row bytes, shared rather than copied — the same type the store hands back.
byteview = { workspace = true }
# The read path (engine), the write path (ingest), the store they meet over, and
# the codec both directions speak.
fjord-encoding = { path = "../fjord-encoding" }
fjord-engine = { path = "../fjord-engine" }
fjord-ingest = { path = "../fjord-ingest" }
fjord-schema = { path = "../fjord-schema" }
fjord-store = { path = "../fjord-store" }
fjord-wire = { path = "../fjord-wire" }
thiserror = { workspace = true }
# The runtime. `rt-multi-thread` because a connection's blocking work — every fjall
# read and write, and the executor itself — goes to `spawn_blocking`, which wants a
# pool to go to.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-util = "0.7.18"

[dev-dependencies]
lasso = { workspace = true }
tempfile = "3.24.0"
