[package]
name = "fjord-wire"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The Fjord DB wire protocol: frame and value codecs, and the message vocabulary a client and server share"

[features]
# Mirrors the other crates': exposes the `arb_*` strategies to consumers outside
# this crate's own `cfg(test)`.
proptest = ["dep:proptest"]

[dependencies]
# The schema, and nothing else. The transport codec is driven by `PredicateTy`
# and shares no code with the storage codec — see the module docs for why that
# is the point rather than an omission.
fjord-schema = { path = "../fjord-schema", version = "0.0.1" }
lasso = { workspace = true }
# The block splitter's marker scan — operations §8's "SIMD memchr-style scan".
memchr = { workspace = true }
proptest = { version = "1.11.0", optional = true }
thiserror = { workspace = true }

[dev-dependencies]
# The storage codec, for the tests that *contrast* against it: what transport
# drops is the whole design, so the comparison is a test rather than a comment.
fjord-encoding = { path = "../fjord-encoding", features = ["proptest"] }
proptest = "1.11.0"
