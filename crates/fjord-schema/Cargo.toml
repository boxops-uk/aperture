[package]
name = "fjord-schema"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The type model, schema language and schema identity for Fjord DB, an embedded immutable fact database"
readme = "README.md"
keywords = ["database", "datalog", "schema", "facts", "parser"]
categories = ["database", "parser-implementations"]
# **Only what a consumer needs.** Cargo packages every file under the crate root by
# default, and `tests/` here reaches outside it — the golden is regenerated from the
# .NET client and lives in the repository, so a test shipped in the package could not
# run anyway. Naming the contents keeps the package to the library, its licence and
# its front page.
include = ["src/**/*.rs", "src/**/*.llw", "build.rs", "README.md", "LICENSE"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
# The schema DSL's front end. [Operations](../../website/content/operations.md)
# puts "parse → AST → canonical model; imports/resolution; fingerprints" in this
# crate, which is why the bottom of the stack has a lexer in it — the dependency
# *direction* is unchanged, and everything above still reads the type model without
# knowing a schema was ever text.
codespan-reporting = "0.13.1"
lasso = { workspace = true }
logos = "0.16.1"
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Resolution reads files, so testing it needs a directory to read.
tempfile = "3"

[build-dependencies]
lelwel = "0.10"
