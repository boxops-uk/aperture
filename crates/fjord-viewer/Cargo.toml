[package]
name = "fjord-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A code-search site over a Fjord DB database — a demonstration binary, not a library"
# Not on crates.io. A package is the client library for a language and nothing
# else — what it takes to construct facts, talk to a database and read rows back.
# This is an internal of the implementation, and publishing it would make its
# shape somebody's dependency.
publish = false

[[bin]]
name = "fjord-viewer"
path = "src/main.rs"

[dependencies]
# The client, and **nothing below it**. A viewer is an ordinary consumer of the
# wire protocol: it holds a schema, opens connections, and asks questions. Reaching
# past the client for the store or the engine would make it a second server rather
# than a demonstration that one is enough.
fjord-client = { path = "../fjord-client" }
fjord-schema = { path = "../fjord-schema" }
fjord-wire = { path = "../fjord-wire" }

axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
    "query",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }

[dev-dependencies]
# A test that needs a real index builds one; the viewer is an ordinary client.
fjord-store-fjall = { path = "../fjord-store-fjall" }
fjord-server = { path = "../fjord-server" }
fjord-store = { path = "../fjord-store" }
tempfile = "3"
