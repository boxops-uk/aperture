[workspace]
members = ["crates/*"]
# **Stated, because a virtual manifest does not inherit it.** While `fjord-cli` was the
# root *package*, its `edition = "2024"` implied `resolver = "3"` for the whole workspace;
# a manifest with no package defaults to `resolver = "1"` and only warns. Feature
# unification is not a formatting detail — resolver 1 unifies features across
# build-dependencies and target-specific dependencies, which is how an optional
# `proptest` ends up linked into a release binary. This keeps what the workspace already
# had.
resolver = "3"
# So `cargo test` and `cargo test -- --ignored --list` — the coverage ledger
# (AGENTS.md, testing) — keep meaning "everything". `members` is already every crate;
# stating `default-members` as well is what stops a future `exclude` or a
# `--no-default-features` habit from quietly narrowing the ledger.
default-members = ["crates/*"]

# **One version for the whole workspace, and one licence.**
#
# Every crate inherits these with `x.workspace = true`, so a release is one edit here
# rather than ten that can disagree. crates.io refuses a package without `description`
# and `license`, so those are per-crate — a description is the one field that has to
# differ — and everything a release stamps identically is stated once.
[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/boxops-uk/fjord"
# Edition 2024's floor. Stated rather than left implicit so crates.io and docs.rs can
# advertise it, and so raising it is a visible decision rather than a `cargo update`.
rust-version = "1.85"

# Versions live here so a crate cannot drift — the fjall pin in particular is
# load-bearing (see `fjord-store`).
[workspace.dependencies]
byteview = "0.10.1"
fjall = "=3.1.8"
memchr = "2.8.2"
lasso = "0.7.3"
serde = { version = "1.0.150", features = ["derive"] }
thiserror = "2.0.18"
