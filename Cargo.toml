[workspace]
members = ["crates/*"]
# So `cargo test` and `cargo test -- --ignored --list` — the coverage ledger
# (`docs/testing.md`) — keep meaning "everything", rather than silently narrowing
# to the root package as crates are extracted.
default-members = [".", "crates/*"]

# Versions live here so a crate cannot drift from the root package's pin — the
# fjall pin in particular is load-bearing (see below).
[workspace.dependencies]
byteview = "0.10.1"
lasso = "0.7.3"
serde = { version = "1.0.150", features = ["derive"] }
thiserror = "2.0.18"

[package]
name = "aperture"
version = "0.1.0"
edition = "2024"

[features]
# Exposes the per-domain `proptest` support modules (named `arb_*` strategies,
# shared fixtures) to consumers outside `cfg(test)` — integration tests and, later,
# the workspace crates. Under `cargo test` the modules are active via `cfg(test)`
# regardless; this feature is for everything that isn't the crate's own unit tests.
#
# `dep:proptest` is what keeps the strategies' own dependency out of an ordinary
# build: the modules that need the crate are exactly the ones this feature (or
# `cfg(test)`, which the dev-dependency covers) turns on.
proptest = ["dep:proptest"]

[dependencies]
aperture-schema = { path = "crates/aperture-schema" }
byteview = { workspace = true }
codespan-reporting = "0.13.1"
# Pinned exactly, not a caret requirement, for two reasons that compound.
#
# The on-disk format is frozen (I3 markers, I13 the embedded schema), so moving
# the storage engine underneath an existing database is a deliberate act with a
# migration question attached — not something `cargo update` should decide.
#
# And the I8 guard reads fjall's snapshot count through a `#[doc(hidden)]` field,
# which carries no stability promise (see `FjallDb::open_snapshots`). That reach
# is confined to test builds, so a move breaks the guard rather than the library
# — but a pin is what makes the break happen when someone chooses to upgrade,
# with the guard in front of them, instead of on an unrelated `cargo update`.
fjall = "=3.1.8"
lasso = { workspace = true }
logos = "0.16.1"
memchr = "2.8.2"
# Optional, and reached only through the `proptest` feature above — never linked
# into an ordinary build. `cargo test` gets it from `[dev-dependencies]`.
proptest = { version = "1.11.0", optional = true }
rustyline = "18"
serde = { workspace = true }
# Reads `example/index.json` — the example indexer's output, which the `aperture`
# shell compiles in and writes as facts at startup (`example/README.md`). Nothing in
# the engine uses it, and nothing should: JSON is the *indexer's* format, not a
# storage one, and Aperture's own ingestion path (PLAN phase 7) is a fact file.
serde_json = "1.0.150"
thiserror = { workspace = true }
tinyvec = { version = "1.11.0", features = ["alloc"] }
tokio-util = "0.7.18"

[dev-dependencies]
# Allocation-counting global allocator for the I9 hot-path guard
# (`exec::scan_is_alloc_free_per_row`). Its counters are thread-local, so it
# survives the parallel test harness; it installs its own `#[global_allocator]`
# unconditionally, so keeping it a dev-dependency is what confines the counting
# allocator to test binaries.
allocation-counter = "0.8.1"
# The `arb_*` strategies are active under `cfg(test)` whether or not the
# `proptest` feature is on, so the crate has to be here as well as being an
# optional dependency.
proptest = "1.11.0"
# Scratch directories for the fjall store batteries (PLAN 1a+).
tempfile = "3.24.0"

[build-dependencies]
lelwel = "0.10"
