[package]
name = "aperture"
version = "0.1.0"
edition = "2024"

[dependencies]
byteview = "0.10.1"
codespan-reporting = "0.13.1"
fjall = "3.1.5"
im-rc = "15.1.0"
itertools = "0.15.0"
lasso = "0.7.3"
logos = "0.16.1"
memchr = "2.8.2"
proptest = "1.11.0"
rustyline = "18.0.0"
serde = { version = "1.0.150", features = ["derive"] }
serde_json = "1.0.150"
string-interner = "0.20.0"
thiserror = "2.0.18"
tinyvec = { version = "1.11.0", features = ["alloc"] }
tokio = "1.52.3"
tokio-util = "0.7.18"
tracing = { version = "0.1.44", features = ["release_max_level_info"] }
tracing-subscriber = "0.3.23"

[build-dependencies]
lelwel = "0.10"
